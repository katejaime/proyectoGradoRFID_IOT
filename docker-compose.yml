services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: basedatos
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/backup_db:/backup/backup_db:ro
      - ./db/restore.sh:/docker-entrypoint-initdb.d/restore.sh:ro
    ports:
      - "5432:5432"
  
  rabbitmq:
    image: rabbitmq:4.3.5-management
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: "1234"
    volumes:
      - ./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
      - ./rabbitmq/20-mqtt.conf:/etc/rabbitmq/conf.d/20-mqtt.conf:ro
    ports:
      - "1883:1883"
      - "5672:5672"
      - "15672:15672"

  backend:
    build: ./back_fast_api-main
    env_file: ./back_fast_api-main/.env
    environment:
      DATABASE_URL: postgresql+psycopg://admin:admin123@db:5432/basedatos
      RABBITMQ_URL: amqp://user:1234@rabbitmq:5672/
    depends_on:
      - db
      - rabbitmq
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./front_react
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata: